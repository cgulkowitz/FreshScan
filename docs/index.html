<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshScan</title>

  <!-- OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- Your pink theme MUST load last -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- Safe fallback pink styles (won’t override your styles.css if it exists) -->
  <style>
    :root{
      --bg:#fff3f8; --panel:#fff; --text:#2b1b24; --muted:#7a4b61;
      --pink:#ff4da6; --pink2:#ff7cc2; --border:rgba(255,77,166,.25);
      --shadow:0 10px 30px rgba(255,77,166,.18);
    }
    html,body{background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:0;}
    .container{max-width:980px; margin:24px auto; padding:0 16px;}
    .card{background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:18px;}
    .section{padding:18px; margin-top:14px;}
    .muted{color:var(--muted);}
    .small{font-size:13px;}
    .btn{background:linear-gradient(90deg,var(--pink),var(--pink2)); color:#fff; border:0; border-radius:14px; padding:10px 14px; font-weight:800; cursor:pointer;}
    .btn:disabled{opacity:.55; cursor:not-allowed;}
    input[type="file"]{padding:10px 0;}
    input, select {border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-family:inherit; background:#fff;}
    textarea{width:100%; border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-family:inherit;}
    #previewImg{max-width:100%; margin-top:12px; border-radius:16px; display:none; pointer-events:none;}
    table{width:100%; border-collapse:separate; border-spacing:0; overflow:hidden; border-radius:14px; border:1px solid var(--border);}
    th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); vertical-align:middle;}
    th{background:rgba(255,77,166,.08);}
    tr:last-child td{border-bottom:none;}
    .pill{display:inline-block; padding:6px 10px; border-radius:999px; font-weight:800; font-size:12px; border:1px solid var(--border);}
    .pill.y{background:rgba(255,77,166,.10);}
    .pill.n{background:rgba(122,75,97,.08);}
    .rowActions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
    .tinyBtn{padding:8px 10px; border-radius:12px; font-weight:800; border:1px solid var(--border); background:#fff; cursor:pointer;}
  </style>
</head>

<body>
<main class="container">
  <header class="card section">
    <h1 style="margin:0;">FreshScan</h1>
    <p class="muted" style="margin:6px 0 0;">
      Upload a receipt → scan → get a clean list of items + perishable/storage + use-by dates.
    </p>
  </header>

  <section class="card section">
    <h2 style="margin-top:0;">1) Upload receipt</h2>
    <input id="fileInput" type="file" accept="image/*" />
    <img id="previewImg" alt="Receipt preview" />

    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px;">
      <label class="small muted" for="purchaseDate" style="font-weight:800;">Purchase date</label>
      <input id="purchaseDate" type="date" />
      <button id="runBtn" class="btn" type="button" disabled>Scan Receipt</button>
      <button id="clearBtn" class="btn" type="button">Clear</button>
    </div>

    <div id="status" class="muted small" style="margin-top:10px;">Choose an image to begin.</div>
  </section>

  <section class="card section">
    <h2 style="margin-top:0;">2) Your list</h2>
    <div class="muted small" style="margin-bottom:10px;">
      Tip: If something is incorrectly marked, toggle “Perishable?” and the storage + date will update.
    </div>
    <div id="itemsWrap"></div>
  </section>

  <section class="card section">
    <h2 style="margin-top:0;">Debug</h2>
    <details>
      <summary class="muted">Show OCR text</summary>
      <textarea id="ocrText" rows="10" placeholder="OCR text will appear here..."></textarea>
    </details>
  </section>
</main>

<script>
  // ----------------------------
  // Helpers
  // ----------------------------
  const $ = (id) => document.getElementById(id);

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function setStatus(msg) { $("status").textContent = msg; }

  function weekdayName(dateObj) {
    return dateObj.toLocaleDateString(undefined, { weekday: "long" });
  }

  function addDays(dateObj, days) {
    const d = new Date(dateObj);
    d.setDate(d.getDate() + days);
    return d;
  }

  // ----------------------------
  // Perishability rules (simple + editable)
  // ----------------------------
  // Default shelf-life days and storage guidance. You can add more keywords anytime.
  const RULES = [
    { test: /(milk|yogurt|cream|cheese|mozzarella|ricotta)/i, perishable:true, days:7, storage:"Refrigerate" },
    { test: /(egg)/i, perishable:true, days:21, storage:"Refrigerate" },
    { test: /(chicken|turkey|beef|pork|steak|ground|fish|salmon|tuna|shrimp)/i, perishable:true, days:2, storage:"Refrigerate (or freeze)" },
    { test: /(lettuce|spinach|salad|greens|kale)/i, perishable:true, days:5, storage:"Refrigerate" },
    { test: /(strawber|blueber|raspber|blackber)/i, perishable:true, days:3, storage:"Refrigerate" },
    { test: /(apple|banana|orange|clementine|grape|pear|peach|plum|mango)/i, perishable:true, days:7, storage:"Counter (most) / Refrigerate to extend" },
    { test: /(bread|bagel|roll|buns)/i, perishable:true, days:5, storage:"Counter (or freeze)" },
    { test: /(pasta|rice|cereal|oats|flour|sugar)/i, perishable:false, days:null, storage:"Pantry" },
    { test: /(soap|shampoo|detergent|towel|napkin|foil|trash|bag)/i, perishable:false, days:null, storage:"Pantry" },
  ];

  function classifyItem(name) {
    for (const r of RULES) if (r.test.test(name)) return { ...r };
    // Default: assume pantry/non-perishable unless user toggles
    return { perishable:false, days:null, storage:"Pantry" };
  }

  // ----------------------------
  // MUCH stricter receipt item extraction
  // Strategy:
  // 1) Remove sensitive patterns
  // 2) Drop obvious header/address/payment lines
  // 3) Only accept lines that have: letters + an END price (e.g. 4.99)
  // This alone removes nearly all store name/address lines.
  // ----------------------------
  const SENSITIVE_PATTERNS = [
    /\b\d{12,19}\b/g,                 // possible card numbers
    /\b(x{2,}\d{2,4})\b/gi,
    /\b(visa|mastercard|amex|discover)\b/gi,
  ];

  const BAD_LINE_PATTERNS = [
    // store/header metadata
    /\b(thank you|survey|customer|service|visit us|www\.|http|\.com)\b/i,
    /\b(cashier|register|terminal|lane|transaction|trx|receipt|invoice)\b/i,

    // address-ish
    /\b(avenue|ave|street|st\.|road|rd\.|blvd|boulevard|drive|dr\.|lane|ln\.|suite|ste\.|plaza)\b/i,
    /\b\d{1,5}\s+[a-z]/i,            // "123 Main"
    /\b\d{5}(-\d{4})?\b/i,           // zip
    /\b(phone|tel)\b/i,

    // totals/payment areas
    /\b(subtotal|total|tax|vat|balance|change|amount due)\b/i,
    /\b(cash|credit|debit|card|approval|auth|authorized|ref|aid|tvr|tsi)\b/i,

    // date/time
    /\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/,
    /\b\d{1,2}:\d{2}\b/,
    /\b(am|pm)\b/i,
  ];

  function normalizeLine(line) {
    return line.replace(/[|]/g, " ").replace(/\s+/g, " ").trim();
  }

  function removeSensitive(text) {
    let t = text;
    for (const re of SENSITIVE_PATTERNS) t = t.replace(re, "");
    return t;
  }

  // price at END of line: "ITEM NAME 4.99"
 // ----------------------------
// Less-strict receipt item extraction (but still blocks store/address/payment)
// Accepts lines with or without prices.
// ----------------------------

function matchAnyPrice(line) {
  // captures a price anywhere, but prefers end-of-line if present
  // examples: "MILK 4.99", "4.99 MILK", "MILK .... 4.99"
  const end = line.match(/(\d{1,3}(?:,\d{3})*|\d+)\.\d{2}\s*$/);
  if (end) return { priceStr: end[0].trim(), index: end.index, atEnd: true };

  const any = line.match(/(\d{1,3}(?:,\d{3})*|\d+)\.\d{2}/);
  if (any) return { priceStr: any[0].trim(), index: any.index, atEnd: false };

  return null;
}

function isMostlyNumbersOrCodes(line) {
  const letters = (line.match(/[A-Za-z]/g) || []).length;
  const digits = (line.match(/[0-9]/g) || []).length;
  // reject lines that are basically numeric codes
  return letters < 3 && digits >= 6;
}

function looksBad(line) {
  if (!line) return true;
  if (/^[-=*_.]+$/.test(line)) return true;
  if (isMostlyNumbersOrCodes(line)) return true;
  for (const re of BAD_LINE_PATTERNS) if (re.test(line)) return true;
  return false;
}

function looksLikeProductName(text) {
  // Heuristics for product-y lines:
  // - has letters
  // - not too long (addresses tend to be long)
  // - not clearly "TOTAL/SUBTOTAL/TAX"
  // - does not look like "123 MAIN ST"
  const t = text.trim();
  const letters = (t.match(/[A-Za-z]/g) || []).length;
  if (letters < 3) return false;

  if (t.length > 42) return false; // addresses/headers often longer
  if (/\b(total|subtotal|tax|change|cash|credit|debit)\b/i.test(t)) return false;

  // line starts with street number + word (address pattern)
  if (/^\d{1,5}\s+[A-Za-z]/.test(t)) return false;

  // many receipts have weight lines we should ignore
  if (/\b(\d+\.\d+\s?(lb|lbs|oz|kg|g))\b/i.test(t)) return false;

  return true;
}

function cleanItemName(line, priceInfo) {
  let name = line;

  // remove dotted/space filler columns like "....."
  name = name.replace(/\.{2,}/g, " ").replace(/\s{2,}/g, " ").trim();

  // if price exists, remove it (either at end or anywhere)
  if (priceInfo?.priceStr) {
    name = name.replace(priceInfo.priceStr, "").trim();
  }

  // remove common trailing markers/codes
  name = name.replace(/\s+[A-Z]{1,2}$/i, "").trim(); // "F", "T", etc.
  name = name.replace(/\b[A-Z]\d{1,3}\b/g, "").trim(); // small codes like A12

  // if still too long after cleaning, likely not an item
  if (name.length > 42) return "";

  return name;
}

function parseReceiptItems(rawText) {
  if (!rawText || typeof rawText !== "string") return [];

  const text = removeSensitive(rawText);

  const lines = text
    .split(/\r?\n/)
    .map(normalizeLine)
    .filter(Boolean);

  const items = [];
  const seen = new Set();

  for (const line of lines) {
    if (looksBad(line)) continue;

    // Split OCR lines that jam multiple columns into one
    const chunks = line.split(/\s{2,}/).map(s => s.trim()).filter(Boolean);

    for (const chunk of chunks) {
      if (looksBad(chunk)) continue;

      const priceInfo = matchAnyPrice(chunk);
      const name = cleanItemName(chunk, priceInfo);

      if (!name) continue;
      if (!looksLikeProductName(name)) continue;

      // Only set price if we found one
      let price = null;
      if (priceInfo?.priceStr) {
        const p = parseFloat(priceInfo.priceStr.replace(/,/g, ""));
        if (Number.isFinite(p)) price = p;
      }

      const key = name.toLowerCase().replace(/\s+/g, " ");
      if (seen.has(key)) continue;
      seen.add(key);

      items.push({ name, price });
    }
  }

  return items;
}

  // ----------------------------
  // OCR
  // ----------------------------
  async function runOCRFromFile(file) {
    const dataURL = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const result = await Tesseract.recognize(dataURL, "eng", {
      logger: (m) => {
        if (m && m.status) {
          const pct = m.progress != null ? Math.round(m.progress * 100) : null;
          setStatus(pct != null ? `${m.status}… ${pct}%` : `${m.status}…`);
        }
      },
    });

    return result?.data?.text || "";
  }

  // ----------------------------
  // UI rendering: restores your "original list" table vibe
  // ----------------------------
  function formatUseBy(purchaseDate, days) {
    if (!purchaseDate || !days) return { label: "—", weekday: "" };
    const d = addDays(purchaseDate, days);
    const mmddyyyy = d.toLocaleDateString();
    return { label: `${mmddyyyy}`, weekday: `(${weekdayName(d)})` };
  }

  function renderTable(rows, purchaseDate) {
    if (!rows.length) {
      $("itemsWrap").innerHTML = `<div class="muted">No items found. (Tip: receipts usually need clear prices visible.)</div>`;
      return;
    }

    const html = `
      <table>
        <thead>
          <tr>
            <th style="width:34%;">Item</th>
            <th style="width:10%;">Price</th>
            <th style="width:14%;">Perishable?</th>
            <th style="width:22%;">Storage</th>
            <th style="width:20%;">Use by</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((r, idx) => {
            const useBy = r.perishable ? formatUseBy(purchaseDate, r.days) : { label:"—", weekday:"" };
            return `
              <tr>
                <td><strong>${escapeHtml(r.name)}</strong></td>
                <td class="muted">${r.price != null ? `$${r.price.toFixed(2)}` : ""}</td>
                <td>
                  <div class="rowActions">
                    <span class="pill ${r.perishable ? "y" : "n"}">${r.perishable ? "Yes" : "No"}</span>
                    <button class="tinyBtn" data-action="toggle" data-idx="${idx}">Toggle</button>
                  </div>
                </td>
                <td>${escapeHtml(r.storage || "")}</td>
                <td>${escapeHtml(useBy.label)} <span class="muted">${escapeHtml(useBy.weekday)}</span></td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    `;

    $("itemsWrap").innerHTML = html;

    // Wire toggles
    $("itemsWrap").querySelectorAll('button[data-action="toggle"]').forEach(btn => {
      btn.addEventListener("click", () => {
        const i = parseInt(btn.getAttribute("data-idx"), 10);
        const row = window.__rows[i];

        row.perishable = !row.perishable;
        if (row.perishable) {
          // if flipping to perishable, give a reasonable default if none
          if (!row.days) row.days = 5;
          if (!row.storage || row.storage === "Pantry") row.storage = "Refrigerate";
        } else {
          row.days = null;
          row.storage = "Pantry";
        }

        renderTable(window.__rows, purchaseDate);
      });
    });
  }

  // ----------------------------
  // Wire up inputs/buttons
  // ----------------------------
  const fileInput = $("fileInput");
  const runBtn = $("runBtn");
  const clearBtn = $("clearBtn");
  const previewImg = $("previewImg");
  const purchaseDateEl = $("purchaseDate");
  const ocrTextEl = $("ocrText");

  // Default purchase date = today (local)
  (function setToday() {
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, "0");
    const dd = String(now.getDate()).padStart(2, "0");
    purchaseDateEl.value = `${yyyy}-${mm}-${dd}`;
  })();

  fileInput.addEventListener("change", () => {
    const file = fileInput.files?.[0];
    runBtn.disabled = !file;

    $("itemsWrap").innerHTML = "";
    if (!file) {
      previewImg.style.display = "none";
      setStatus("Choose an image to begin.");
      return;
    }

    const url = URL.createObjectURL(file);
    previewImg.src = url;
    previewImg.style.display = "block";

    setStatus("Ready to scan. Click “Scan Receipt”.");
  });

  runBtn.addEventListener("click", async (e) => {
    e.preventDefault();

    const file = fileInput.files?.[0];
    if (!file) return;

    runBtn.disabled = true;
    clearBtn.disabled = true;
    $("itemsWrap").innerHTML = "";
    setStatus("Starting OCR…");

    try {
      const text = await runOCRFromFile(file);
      ocrTextEl.value = text;

      const rawItems = parseReceiptItems(text);

      // Build “original list” rows with perishability info
      const purchaseDate = purchaseDateEl.value ? new Date(purchaseDateEl.value + "T00:00:00") : null;

      const rows = rawItems.map(it => {
        const c = classifyItem(it.name);
        return {
          name: it.name,
          price: it.price,
          perishable: c.perishable,
          days: c.days,
          storage: c.storage
        };
      });

      // Expose for toggle handler
      window.__rows = rows;

      setStatus(`Done. Found ${rows.length} item(s).`);
      renderTable(rows, purchaseDate);
    } catch (err) {
      console.error(err);
      setStatus(`Error: ${err?.message || "OCR failed."}`);
    } finally {
      runBtn.disabled = false;
      clearBtn.disabled = false;
    }
  });

  clearBtn.addEventListener("click", () => {
    fileInput.value = "";
    $("itemsWrap").innerHTML = "";
    ocrTextEl.value = "";
    previewImg.style.display = "none";
    runBtn.disabled = true;
    setStatus("Cleared. Choose an image to begin.");
  });

</script>
</body>
</html>
